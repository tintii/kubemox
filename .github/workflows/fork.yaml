name: Fork image and chart

# Publishes this fork to the owner's GHCR with the built-in GITHUB_TOKEN; no
# repository secrets. The upstream release workflows only run on alperencelik.
on:
  push:
    branches: [main, 'feat/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    if: github.repository_owner != 'alperencelik'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kubemox"
          tags="$image:sha-$GITHUB_SHA"
          if [ "$REF_TYPE" = tag ]; then tags="$tags,$image:$REF_NAME"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - run: printf 'Published `%s@%s`\n' "${{ steps.tags.outputs.tags }}" "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  # The chart carries the CRDs, so it is published alongside the image on tags.
  # It goes under charts/ so it does not collide with the image repository.
  chart:
    needs: image
    if: github.repository_owner != 'alperencelik' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4
      - name: Package and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          TAG: ${{ github.ref_name }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          helm package charts/kubemox --destination dist --version "${TAG#v}" --app-version "$TAG"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin
          trap 'helm registry logout ghcr.io' EXIT
          helm push "dist/kubemox-${TAG#v}.tgz" "oci://ghcr.io/$owner/charts"
